# Production settings for Cloud Run (every setting: docs/ARCHITECTURE.md §13).
MODEL_PROVIDER: gemini
GEMINI_BACKEND: vertex
GOOGLE_CLOUD_PROJECT: shop-honest-72fd8
GOOGLE_CLOUD_LOCATION: global
STORE_BACKEND: gcp
ENABLE_LIVE: "true"
MAX_LIVE_AUDITS: "2"
LIVE_PER_IP_PER_HOUR: "3"
LIVE_PER_DAY: "100"
ALLOWED_HOSTS: shop-honest-ai.web.app,shop-honest-ai.firebaseapp.com
ALLOW_PRIVATE_TARGETS: "false"
# The site reads the event stream straight from Cloud Run (Hosting buffers streams; ADR-0010).
CORS_ORIGINS: https://shop-honest-ai.web.app,https://shop-honest-ai.firebaseapp.com
CORS_ORIGIN_REGEX: ^https://shop-honest-ai--[a-z0-9-]+\.web\.app$
