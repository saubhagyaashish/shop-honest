<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Amazfit Bip Smartwatch | Fixture Watches</title>
<!-- kingclothing.in-like: a newsletter popup on arrival, built from plain divs (no dialog role, no "modal" class), whose
     only way out is an icon with no words; it ignores Escape. Choosing a strap size opens a second offer over the
     page that closes only with Escape. "Sign up" is in both and must never be pressed. -->
<style>
body{font-family:sans-serif;margin:0} main{padding:16px}
.btn{background:#111;color:#fff;border:0;padding:10px 18px;cursor:pointer}
.nl-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
.nl-box{position:absolute;top:120px;left:320px;width:640px;height:300px;background:#fff;padding:24px;box-sizing:border-box}
.nl-close{position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid #999;cursor:pointer}
.offer{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.offer div{position:absolute;top:200px;left:400px;width:480px;height:220px;background:#fff;padding:24px;box-sizing:border-box}
</style></head>
<body>
<main>
  <h1>Amazfit Bip Smartwatch</h1>
  <p>₹4,699</p>
  <p><label>Strap size <select name="size"><option>32mm</option><option>40mm</option></select></label></p>
  <button class="btn" id="add">Add to cart</button>
</main>
<div class="nl-wrap" id="newsletter"><div class="nl-box"><span class="nl-close"></span>
  <h3>Subscribe to get more benefit</h3><p>Join our 50,000+ happy customers.</p>
  <button class="btn" onclick="location.href='../login.html'">Sign up</button></div></div>
<div class="offer" id="offer"><div><h3>Wait! Take 10% off your first order</h3>
  <button class="btn" onclick="location.href='../login.html'">Sign up</button></div></div>
<script>
  document.querySelector('.nl-close').addEventListener('click', () => document.getElementById('newsletter').remove())
  document.querySelector('select').addEventListener('change', () => setTimeout(() => {
    document.getElementById('offer').style.display = 'block'
  }, 200))
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('offer').style.display = 'none' })
  document.getElementById('add').addEventListener('click', () => {
    sessionStorage.setItem('item', 'Amazfit Bip Smartwatch')
    location.href = 'cart.html'
  })
</script>
</body></html>
