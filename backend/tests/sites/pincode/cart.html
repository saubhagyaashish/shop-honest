<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shopping Cart | Market</title>
<!-- Flipkart-like: a "Platform Fee ₹10" the product page never mentioned, and "Place Order" greyed out until the
     shopper gives a delivery pincode. -->
<style>body{font-family:sans-serif;padding:16px} .row{display:flex;justify-content:space-between;width:320px}
button.order{background:#ccc;color:#fff;border:0;padding:12px 24px;cursor:not-allowed}</style></head>
<body>
<div><button>Enter Delivery Pincode</button></div>
<ul><li>Acme Buds Air Wireless Earbuds <s>₹3,490</s> ₹1,449 <button>Remove</button></li></ul>
<section>
  <h3>Price details</h3>
  <div class="row"><span>Price (1 item)</span><span>₹3,490</span></div>
  <div class="row"><span>Discount</span><span>- ₹2,041</span></div>
  <div class="row"><span>Platform Fee</span><span>₹10</span></div>
  <div class="row"><span>Total Amount</span><span>₹1,459</span></div>
</section>
<p>Sorry! Currently not available in your pincode</p>
<button class="order" disabled>Place Order</button>
</body></html>
