<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Blue Top | Exercise Store</title>
<!-- AutomationExercise-like, on a slow day: the add registers only after 4 s, then an "Added!" popup offers "View Cart".
     The header's Cart link works at once, so opening it too early finds the cart empty. -->
<style>body{font-family:sans-serif;padding:16px} h1{font-size:24px} .modal{display:none;position:fixed;top:30%;left:30%;
background:#fff;border:2px solid #333;padding:24px} .btn{background:#fe980f;color:#fff;border:0;padding:10px 18px;cursor:pointer}</style></head>
<body>
<header><a href="cart.html">Cart</a></header>
<h1>Blue Top</h1>
<p>Rs. 500</p>
<button class="btn" onclick="setTimeout(() => { sessionStorage.setItem('item', 'Blue Top'); document.querySelector('.modal').style.display = 'block' }, 4000)">Add to cart</button>
<div class="modal" role="dialog"><h4>Added!</h4><p>Your product has been added to cart.</p><a href="cart.html">View Cart</a> <button onclick="this.parentElement.style.display='none'">Continue Shopping</button></div>
</body></html>
