<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cart | Exercise Store</title>
<style>body{font-family:sans-serif;padding:16px} .btn{background:#fe980f;color:#fff;padding:10px 18px;cursor:pointer}</style></head>
<body>
<h2>Shopping Cart</h2>
<div id="cart"></div>
<script>
const item = sessionStorage.getItem('item')
document.getElementById('cart').innerHTML = item
  ? `<table><tr><td>${item}</td><td>Rs. 500</td><td><a class="cart_quantity_delete">x</a></td></tr></table>
     <a class="btn" onclick="location.href='../checkout.html'">Proceed To Checkout</a>`
  : '<b>Cart is empty!</b> Click <a href="product.html">here</a> to buy products.'
</script>
</body></html>
