<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Build Your Wall | Fixture Posters</title>
<!-- posterized.in-like: the buy bar, with its price and "Add to cart", is stuck to the screen inside a row of wall layouts
     that each show a picture and a price, so it sits among them like one more product card. -->
<style>
body{font-family:sans-serif;margin:0;padding:16px} .layouts{display:flex;flex-wrap:wrap;gap:12px}
.layout{width:220px} .layout img{width:220px;height:160px;background:#ccc;display:block}
.bar{position:sticky;bottom:0;width:100%;background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between}
.bar button{background:#fb0;border:0;padding:10px 18px;cursor:pointer}
</style></head>
<body>
<h1>Build Your Wall | Custom Poster Wall Collage</h1>
<p>Rs. 549.00</p>
<div class="layouts">
  <div class="layout"><img alt="Studio wall"><p>Studio Wall · ₹549</p></div>
  <div class="layout"><img alt="Grid wall"><p>Grid Wall · ₹549</p></div>
  <div class="layout"><img alt="Zigzag wall"><p>Zigzag Wall · ₹549</p></div>
  <div class="layout"><img alt="Heart wall"><p>Heart Wall · ₹549</p></div>
  <div class="bar"><span>₹549</span><button id="add">Add to cart</button></div>
</div>
<script>
  document.getElementById('add').addEventListener('click', () => {
    sessionStorage.setItem('item', 'Build Your Wall')
    location.href = 'cart.html'
  })
</script>
</body></html>
