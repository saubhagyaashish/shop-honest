[project]
name = "shop-honest-backend"
version = "0.1.0"
description = "Shop Honest backend: audit API, runner and (later) ADK agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "sse-starlette>=3.5,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "playwright>=1.63,<1.64",
    "google-adk>=2.11,<2.12",
    "litellm>=1.104,<1.105",
    "pillow>=11",
    "google-cloud-firestore>=2.20",
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.27",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.26,<5",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "browser: runs a real headless Chromium against web/dist (skipped when it isn't built)",
    "cloud: uses the real Firestore and Cloud Storage (set SHOP_HONEST_CLOUD_TESTS=1 with gcloud ADC)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# Typographic dashes and arrows are intentional in user-facing text.
ignore = ["RUF001", "RUF002"]
